# Testa, gera e publica o site no GitHub Pages a cada envio para a main (1 a 2 minutos).
# Pull requests rodam só os testes. Se um teste falhar, nada é publicado e o site continua como estava.
# Repositório público: Actions e Pages gratuitos.
name: Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  construir:
    name: Testar e gerar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  publicar:
    name: Publicar
    if: github.ref == 'refs/heads/main'
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
