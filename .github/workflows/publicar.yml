# Publica o site no GitHub Pages. Este arquivo só vale no repositório PÚBLICO do site (cópia da pasta site/,
# que vira a raiz de lá); no repositório privado do FosterMCP ele fica parado dentro de site/.
# Repositório público: Actions e Pages são gratuitos. Testa, constrói com --publicar (exige o version.json
# real) e publica a pasta _site.
name: Publicar site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --publicar
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v5
